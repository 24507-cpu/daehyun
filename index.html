<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥦 냉장고 파먹기 연구소</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; line-height: 1.6; background-color: #f9f9f9; }
    .card { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .hidden { display: none; }
    button { background-color: #2E7D32; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 5px; }
    button:hover { background-color: #1B5E20; }
    input { width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 5px; }
    #recipe-steps p { background: #f1f8e9; padding: 10px; border-radius: 6px; margin: 5px 0; border-left: 4px solid #8bc34a; }
  </style>
</head>
<body>

  <h1>🥦 지구를 구하는 AI 레시피 연구소</h1>
  
  <div id="auth-section" class="card">
    <div id="login-form">
      <h3>로그인 / 회원가입</h3>
      <input type="email" id="email-input" placeholder="이메일">
      <input type="password" id="password-input" placeholder="비밀번호 (6자리 이상)">
      <br>
      <button id="btn-login">로그인</button>
      <button id="btn-signup" style="background-color: #7e57c2;">회원가입</button>
    </div>
    <div id="user-info" class="hidden">
      <p>👋 <span id="user-name" style="font-weight: bold;"></span>님 환영합니다! 환경을 함께 지켜요. 🌍</p>
      <button id="btn-logout" style="background-color: #757575;">로그아웃</button>
    </div>
  </div>

  <div class="card">
    <h3>남은 재료 입력</h3>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="ingredients-input" placeholder="예: 찬밥, 쌈장, 먹다남은 치킨">
      <button id="btn-generate">요리 시작! 🍳</button>
    </div>
  </div>

  <div id="result-section" class="card hidden">
    <h2 id="recipe-title" style="color: #2E7D32;">요리 이름</h2>
    <p>⏱️ <b>예상 조리 시간:</b> <span id="cooking-time"></span></p>
    <p style="color: #E65100; font-weight: bold; background: #FFF3E0; padding: 10px; border-radius: 6px;">🌱 <b>지구 구하기 미션:</b> <span id="eco-msg"></span></p>
    <hr style="border: 0.5px solid #eee;">
    <div id="recipe-steps"></div>
    <hr style="border: 0.5px solid #eee; margin-top: 20px;">
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button id="btn-tts" style="background-color: #0288D1;">🔊 음성 가이드 듣기</button>
      <button id="btn-save" class="hidden" style="background-color: #FFA000;">⭐ 나의 요리책에 저장</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALwZj6PbImDMxo0FAiUNVIqn_A-gRlZnE",
      authDomain: "test-ba7e7.firebaseapp.com",
      databaseURL: "https://test-ba7e7-default-rtdb.firebaseio.com",
      projectId: "test-ba7e7",
      storageBucket: "test-ba7e7.firebasestorage.app",
      messagingSenderId: "700659947641",
      appId: "1:700659947641:web:e62c9601ae47aeaa319ca8",
      measurementId: "G-6WQ79EBQJY"
    };

    const GAS_URL = "https://script.google.com/macros/s/AKfycbywrnvvDZ2TL8tUGCXxv_lkjYljoPsEuIlGzTwuPlMs_RVZ7uNyY0gDPdAs85CyY28n/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRecipe = null; 

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('user-name').innerText = user.email;
        if(currentRecipe) document.getElementById('btn-save').classList.remove('hidden');
      } else {
        currentUser = null;
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('user-info').classList.add('hidden');
        document.getElementById('btn-save').classList.add('hidden');
      }
    });

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("회원가입 완료!");
      } catch (e) { alert("가입 실패: " + e.message); }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) { alert("로그인 실패: " + e.message); }
    });
    
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await signOut(auth);
    });

    document.getElementById('btn-generate').addEventListener('click', async () => {
      const ingredients = document.getElementById('ingredients-input').value;
      if(!ingredients) return alert("재료를 입력해 주세요!");
      document.getElementById('btn-generate').innerText = "AI 셰프가 고민 중...🤔";
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ ingredients: ingredients })
        });
        const recipe = await response.json();
        currentRecipe = recipe; 
        document.getElementById('recipe-title').innerText = recipe.recipeName;
        document.getElementById('cooking-time').innerText = recipe.cookingTime;
        document.getElementById('eco-msg').innerText = recipe.ecoMessage;
        document.getElementById('recipe-steps').innerHTML = recipe.steps.map((s, i) => `<p><b>${i+1}단계:</b> ${s}</p>`).join('');
        document.getElementById('result-section').classList.remove('hidden');
        if (currentUser) document.getElementById('btn-save').classList.remove('hidden');
      } catch (err) { alert("실패: " + err.message); } 
      finally { document.getElementById('btn-generate').innerText = "요리 시작! 🍳"; }
    });

    document.getElementById('btn-tts').addEventListener('click', () => {
      if(!currentRecipe) return;
      const text = `${currentRecipe.recipeName}을 시작합니다. ${currentRecipe.cookingTime} 소요됩니다. ${currentRecipe.steps.join('. ')}. ${currentRecipe.ecoMessage}`;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      window.speechSynthesis.speak(utterance);
    });

    document.getElementById('btn-save').addEventListener('click', async () => {
      if(!currentUser || !currentRecipe) return;
      await addDoc(collection(db, "userRecipes"), { ...currentRecipe, uid: currentUser.uid, savedAt: new Date() });
      alert("저장되었습니다!");
    });
  </script>
</body>
</html>
